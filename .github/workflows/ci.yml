name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (riscv64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v3
      - run: ./scripts/test.sh

  e2e:
    name: e2e on cartesi devnet
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @cartesi/cli@2.0.0-alpha.35
      - run: cartesi build
      - name: start devnet
        run: |
          nohup cartesi run > run.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q 'contract deployed' run.log && exit 0
            sleep 5
          done
          cat run.log; exit 1
      - run: python3 tests/e2e.py
      - name: app logs
        if: always()
        run: cartesi logs 2>&1 | grep -E '\[dapp\]|Processing input' | tail -100 || true
